; SL_MagicMenu.ini - the magic menu's settings
; Installed as Data/SKSE/Plugins/SL_MagicMenu.ini. Every key is optional; a missing or bad value keeps the default.
; The keys marked "read by the Heart of Magic block" belong to the add-on SL_MagicMenu_HoM (the spell tree window, the
; learning progress card and the node card); the magic menu itself does not read them.

[General]
bEnabled=1
; self-test lines ("SelfTest: ... PASS/FAIL") in SL_MagicMenu.log - off for play; set bSelfTest=1 to turn them on when
; reporting a problem (they add log lines and a few extra reads per frame)
bSelfTest=0
; move the 3D preview into the preview box, below its PREVIEW title, and fit every model to it (not while Inventory
; Reforged runs its panel in the magic menu). Works with bDrawPreviewOver=0 too: the game's own pass draws the fitted
; model a frame later, and the preview box is then drawn without its black fill so the 3D under the menu shows through
bMovePreview=1
; move SkyUI's item card into the spell card's block (under the preview, or under the learning progress card when the
; Heart of Magic block is installed); not while Inventory Reforged runs its panel in the magic menu
bMoveItemCard=1
; draw the 3D spell preview again after the menu (MagicMenu PostDisplay): the magic menu draws it before its
; picture, so the black PREVIEW box would cover it (off while Inventory Reforged runs its panel in the magic menu;
; with 0 the box has no black fill)
bDrawPreviewOver=1
; show the 3D model of a spell clicked in the Heart of Magic block's tree that the list does not hold (not learned yet) in the
; preview box too; off by default (1 = on). When the game cannot build the model it is not tried again in that menu (with
; bSelfTest=1, "SelfTest: P3 PASS/FAIL" in the log says which)
bPreviewUnlearned=0
; hide the game's own 3D pass under the menu for the selected spell's model so only the copy in the box shows
bHideGamePass=1
; clip the 3D preview to the box (scissor)
bClipPreview=1
; our own info card (name, school and level, description, magicka) in place of SkyUI's item card, on every tab;
; it fills its column under the blocks above it. 0 = SkyUI's card, moved into the spell card's block
; and fitted to its slot (bMoveItemCard)
bOwnCard=1
; hide the dark see-through disc behind a spell's preview effect (the art's "Cylinder" backing shape)
bHideBackdrop=1
; also hide the effect's soft glow and light rays (its additive halo shapes); off by default
bHideGlow=0

[Preview]
; keep the see-through preview box see-through behind the spell's effect: after the effect is drawn, the box's
; transparency is put back as it was (the effect's colours stay), so no dark cloud covers the game view behind it;
; 0 = the box keeps what the effect's drawing left (a dark cloud can show behind the effect)
bKeepPanelAlpha=1
; 1 = no 3D preview on the Powers tab; 0 = the Powers and Shouts tabs preview their 3D in the box like
; the spell tabs
bHidePowers3D=0

[Keys]
; DirectInput scan codes: 22 = U (next learnable spell), 34 = G (learn the selected node next).
; R (19) is Spell Organizer's remove-spell key in the magic menu and N (49) Creature Framework's puppet key;
; the on-screen hints show whatever key is set here
; read by the Heart of Magic block (SL_MagicMenu_HoM); without it these keys do nothing
iNext=22
iSetTarget=34
; the layout mode (move the blocks beside the spell list): this key, or the lock button below the left column, turns
; it on; again (or the lock button) saves the layout and turns it off; Esc leaves it without saving. 37 = K (in no
; controlmap line of this menu; SexLab scenes only). The layout is saved in SL_MagicMenu_Layout.json next to this ini
iLayout=37
; the same on a gamepad, as an SKSE button code: 273 = right stick click (this menu's Item Zoom on a gamepad; every
; pad button is used by the menu). -1 = no gamepad button
iGamepadLayout=273
; in the layout mode (fixed keys, not set here): D-pad / arrows move the focus between the blocks, A / Enter picks the
; focused block up, D-pad / arrows then move it (up/down in its column, left/right to the other column), A / Enter
; drops it, B / Esc puts it back (with nothing picked: leaves the mode without saving); LB / RB, [ / ] or
; PageUp / PageDown move the column border by 10; the right stick scrolls the focused block's column

[Layout]
; stage units of the magic menu movie (1280 x 720): layout E2 (one two-column grid, gap fPanelGap everywhere;
; left column 648..969, right 978..1238, row 1 67..297, row 2 306..623).
; These rects are the blocks' default sizes and places: each block keeps its height; the area they share is
; fPreviewLeft..fTreeRight x fPreviewTop..fItemCardBottom. The layout file SL_MagicMenu_Layout.json (next to this
; ini, optional) overrides the order of the blocks in the two columns and the border between them; without it
; the blocks sit as below. The magic menu reads fPreview*, fItemCard*, fTreeRight (where the columns end) and
; fPanelGap; the other fTree*, fProgress* and fNodeCard* keys and the tree keys below are read by the Heart of
; Magic block (SL_MagicMenu_HoM). Without that block the spell card sits right under the preview and the right
; column is empty
fPreviewLeft=648
fPreviewTop=67
fPreviewRight=969
fPreviewBottom=297
; fTreeLeft / fTreeTop / fTreeBottom are read by the Heart of Magic block (SL_MagicMenu_HoM); fTreeRight is also
; where the magic menu's columns end (the right column's right edge)
fTreeLeft=978
fTreeTop=67
fTreeRight=1238
fTreeBottom=297
; read by the Heart of Magic block (SL_MagicMenu_HoM); without it these keys do nothing
fProgressLeft=648
fProgressTop=306
fProgressRight=969
fProgressBottom=408
fItemCardLeft=648
fItemCardTop=417
fItemCardRight=969
fItemCardBottom=623
; read by the Heart of Magic block (SL_MagicMenu_HoM); without it these keys do nothing
fNodeCardLeft=978
fNodeCardTop=306
fNodeCardRight=1238
fNodeCardBottom=623
; read by the Heart of Magic block (SL_MagicMenu_HoM); without it these keys do nothing
; stage units per spell tree unit, one fixed scale (the tree window is a view on Heart of Magic's own layout; its
; closest two spells are about 38 tree units apart, 28 at 0.75)
fTreeScale=0.75
; size of the tree's spell marks and click areas: Heart of Magic's own sizes (radius 12 learned, 9 learnable, 7 to 11
; locked) times fTreeScale times this; 1 = HoM's sizes (1.15 = 15 % larger)
fTreeMarkScale=1.0
; link steps from the centre that count as linked: 1 = the spells directly linked to it. A linked spell can be
; clicked even when locked; other locked spells in the window are drawn but cannot be clicked
iMaxSteps=1
; most spells drawn in the tree window: the centre, the clicked spell and the learning target first, then the nearest
iMaxNodes=60
; gap between the blocks of a column and between the two columns (0..110). On the Powers and Shouts tabs (no
; tree, progress or node card from the Heart of Magic block) the hidden blocks close up: the item card sits this far
; under the preview
fPanelGap=9

[Display]
; the on-screen text language (the magic menu and the Heart of Magic block): auto = the game's (Korean also on an English game
; with Korean strings), or a code (en, ko) of a lang/<code>.json
; read again at each magic menu open. The optional SKSE Menu Framework tab "Magic Menu Note" writes it and [Blocks] sHidden to
; SL_MagicMenu_User.ini next to this file (not shipped, kept over updates): a key there wins over the same key here
sLanguage=auto

[Blocks]
; blocks left out of the magic menu (their layout places kept): comma-separated ids - preview, spellcard, SL_MagicMenu_HoM.tree ...
sHidden=

[Debug]
; read by the Heart of Magic block (SL_MagicMenu_HoM); without it these keys do nothing
; a test switch, not a setting: stage units added to the node card block's height, so the right column is taller than
; its area and scrolls (mouse wheel over the column). 0 = no effect (the default layout never scrolls). Testing only
fDebugExtraHeight=0
; a test switch, not a setting: 1 = the plugin registers its own add-on block "SL_MagicMenu.filler" (300 high, a title and
; three bars) through the add-on block path. Without a saved place it goes to the left column after the spell card, so the
; left column (the 3D preview's) is taller than its area: scroll it with the mouse wheel to see the preview cut at the
; column's edge; and the add-on API can be tried without another mod. 0 = off. Testing only
bDebugFillerBlock=0
